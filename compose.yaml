# Stackbrief - Powered by AI.  docker compose up -d --build
# The AI review comes from the Claude gateway, a separate shared service your other apps can use too:
# https://github.com/H0m3Lab/claude-gateway (start it first, and copy jobs/update-review.md into its jobs/ folder).
services:
  scanner:
    build: ./scanner
    image: stackbrief-scanner:local
    container_name: stackbrief-scanner
    restart: unless-stopped
    env_file: .env
    environment:
      GATEWAY_URL: ${GATEWAY_URL:-http://claude:8765}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # read containers, run Trivy/regctl (see docs/security.md)
      - ./data:/data                                # reports/ and state/
      - ./config:/config:ro                         # ignore-versions.txt
    networks: [gateway]
    logging: {driver: json-file, options: {max-size: "5m", max-file: "3"}}

networks:
  gateway:                                          # the network the Claude gateway is on
    name: ${GATEWAY_NETWORK:-claude}
    external: true
